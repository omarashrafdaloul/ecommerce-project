<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow | Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="page-content">
    <h2>Our Products</h2>
    <p>Explore our everyday technology essentials.</p>

    <section class="product-grid" aria-label="Product catalogue">
      <article class="product">
        <img src="images/laptop.jpg" alt="Business laptop">
        <h3>Business Laptop</h3>
        <p>AED 3,499</p>
        <button type="button">Add to Cart</button>
      </article>

      <article class="product">
        <img src="images/headphones.jpg" alt="Wireless headphones">
        <h3>Wireless Headphones</h3>
        <p>AED 299</p>
        <button type="button">Add to Cart</button>
      </article>

      <article class="product">
        <img src="images/keyboard.jpg" alt="Mechanical keyboard">
        <h3>Mechanical Keyboard</h3>
        <p>AED 249</p>
        <button type="button">Add to Cart</button>
      </article>

      <article class="product">
        <img src="images/mouse.jpg" alt="Wireless mouse">
        <h3>Wireless Mouse</h3>
        <p>AED 99</p>
        <button type="button">Add to Cart</button>
      </article>

      <article class="product">
        <img src="images/monitor.jpg" alt="Computer monitor">
        <h3>24-inch Monitor</h3>
        <p>AED 699</p>
        <button type="button">Add to Cart</button>
      </article>

      <article class="product">
            <img src="images/webcam.jpg" alt="HD webcam">
            <h3>HD Webcam</h3>
        <p>AED 179</p>
        <button type="button">Add to Cart</button>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 ShopNow.</p>
  </footer>
</body>
</html>
