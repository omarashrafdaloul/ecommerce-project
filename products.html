<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow | Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="page-content">
    <h2>Our Products</h2>
    <p>Explore our everyday technology essentials.</p>

    <section class="controls" aria-label="Product controls">
      <input type="text" id="search-box" placeholder="Search products...">

      <div class="categories">
        <button type="button" class="category-btn active" data-category="All">All</button>
        <button type="button" class="category-btn" data-category="Computers">Computers</button>
        <button type="button" class="category-btn" data-category="Accessories">Accessories</button>
        <button type="button" class="category-btn" data-category="Phones">Phones</button>
      </div>

      <select id="sort-select">
        <option value="default">Sort by</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
      </select>
    </section>

    <section id="product-list" class="product-grid" aria-label="Product catalogue"></section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 ShopNow.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
