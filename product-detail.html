<script>
  const SUPABASE_URL = "https://oteufegnegyslayjblwl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_3KnxyT13IZF0wzW-Vef1Bw_MEVf31hj";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(window.location.search);
  const productId = params.get("id");

  async function loadProduct() {
    const detail = document.getElementById("detail");

    if (!productId) {
      detail.innerHTML = "<p>Product not found.</p>";
      return;
    }

    const { data: product, error } = await db
      .from("product")
      .select("*, category(category_name)")
      .eq("product_id", productId)
      .single();

    if (error || !product) {
      detail.innerHTML = "<p>Product not found.</p>";
      return;
    }

    const categoryName =
      product.category?.category_name ?? "Uncategorized";

    detail.innerHTML = `
      <article class="product">
        <h2>${product.name}</h2>
        <p>${product.description ?? ""}</p>
        <p>AED ${Number(product.price).toLocaleString()}</p>
        <p>Category: ${categoryName}</p>
        <p>Stock: ${product.stock}</p>
      </article>`;
  }

  loadProduct();
</script>
